

services:

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: nome_do_seu_banco
      MYSQL_ROOT_PASSWORD: sua_senha_forte
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql


  api:
    build: .
    container_name: fastify_api
    depends_on:
      - db
    ports:
      - "3333:3333"
    environment:
      
      DATABASE_URL: "mysql://root:${DB_PASSWORD}@db:3306/${DB_NAME}"
    stdin_open: true
    tty: true

volumes:
  db_data: