<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
    <title>Tela Semana 3</title>
</head>
<body>

    <header class="container">
        <input type="text" id="cep" placeholder="CEP">
        <button class="button" onclick="pesquisar()">Pesquisar</button>
    </header>

    <main class="card">
        <div class="card-topo">
            <h1>CEP <span id="ncep"></span> </h1>
        </div>
        <div class="card-corpo">
            <ul>
                <li>Logradouro:  <span id="logradouro"></span></li>
                <li>Complemento:  <span id="complemento"></span></li>
                <li>Bairro:  <span id="bairro"></span></li>
                <li>Localidade:  <span id="localidade"></span></li>
                <li>UF:  <span id="uf"></span></li>
                <li>Estado:  <span id="estado"></span></li>
            </ul>
        </div>

    </main>
        
    
    <script src="script.js"></script>
</body>
</html>
