services:
  api:
    build: .
    container_name: api
    restart: always

    ports:
      - "3333:3333"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DATABASE_URL: mysql://root:gustavoCap1%40@mysql:3306/biblioteca
      JWT_SECRET: gustavo_api_serra_2026

    volumes:
      - .:/app
      - /app/node_modules

    command: sh -c "npx prisma migrate deploy && npm run dev"


  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: gustavoCap1@
      MYSQL_DATABASE: biblioteca

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  mysql_data: