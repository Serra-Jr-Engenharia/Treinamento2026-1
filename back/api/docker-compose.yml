services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Mortadela2906.
      MYSQL_DATABASE: backend
    ports:
      - "3307:3306"

  api:
    build: .
    container_name: fastify_api
    restart: always
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: mysql://root:Mortadela2906.@db:3306/backend
    depends_on:
      - db